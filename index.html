<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prete Family Responsibilities</title>

<!-- Installable "Chores" home-screen app (Add to Home Screen on iPhone) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chores">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<!-- Fonts load from Google Fonts but the site falls back to system fonts offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   DESIGN TOKENS
   ========================================================================== */
:root{
  --paper:#F7F6F3;
  --ink:#16181D;
  --muted:#6C707A;
  --rule:#D9D7D1;
  --hyrum:#33556E;
  --rosemary:#74374F;
  --felicity:#A4712A;

  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
  --font-body:"Inter Tight", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --accent:var(--ink);        /* overridden per-kid via body[data-kid] */
  --maxw:640px;
}

/* Per-child accent, applied only while that child's screen is open */
body[data-kid="hyrum"]{ --accent:var(--hyrum); }
body[data-kid="rosemary"]{ --accent:var(--rosemary); }
body[data-kid="felicity"]{ --accent:var(--felicity); }

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
.num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

/* ==========================================================================
   LAYOUT
   ========================================================================== */
#app{ max-width:var(--maxw); margin:0 auto; padding:22px 18px 64px; }
.view{ opacity:1; }
.fade-out{ opacity:0; }
@media (prefers-reduced-motion:no-preference){
  .view{ transition:opacity .18s ease; }
}

/* Skip link */
.skip{
  position:absolute; left:-9999px; top:8px;
  background:var(--ink); color:var(--paper);
  padding:10px 14px; border-radius:8px; z-index:100; text-decoration:none;
}
.skip:focus{ left:12px; }

/* Focus rings — visible everywhere */
a:focus-visible, button:focus-visible, input:focus-visible,
[tabindex]:focus-visible, .card:focus-visible, .link-row a:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:4px;
}

/* ==========================================================================
   TYPOGRAPHY HELPERS
   ========================================================================== */
h1,h2,h3{ font-family:var(--font-display); font-weight:500; line-height:1.12; margin:0; }
.eyebrow{
  font-family:var(--font-mono); font-size:.72rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin:0 0 6px;
}
.rule{ border:0; border-top:1px solid var(--rule); margin:20px 0; }
.rule-accent{ border:0; border-top:2px solid var(--accent); margin:0 0 18px; width:44px; }
.muted{ color:var(--muted); }

/* ==========================================================================
   TOP BRAND / BACK NAV
   ========================================================================== */
.brand{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; }
.brand h1{ font-size:1.32rem; letter-spacing:.005em; }
.brand .ver{ font-family:var(--font-mono); font-size:.72rem; color:var(--muted); white-space:nowrap; }
.back{
  display:inline-flex; align-items:center; gap:8px;
  min-height:44px; text-decoration:none; color:var(--muted);
  font-family:var(--font-mono); font-size:.8rem; letter-spacing:.04em;
}
.back:hover{ color:var(--ink); }
.back svg{ width:16px; height:16px; }

/* ==========================================================================
   HOME — THIS WEEK header + countdown
   ========================================================================== */
.thisweek{ margin-bottom:6px; }
.thisweek h2{ font-size:2.05rem; letter-spacing:-.01em; }
.weekmeta{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:8px; color:var(--muted); }
.weekmeta .num{ color:var(--ink); }

.countdown{
  margin:16px 0 6px; padding:16px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
}
.countdown.downtime{ border-top-width:2px; border-top-color:var(--ink); }
.countdown .state{ font-family:var(--font-mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.countdown.downtime .state{ color:var(--ink); font-weight:600; }
.countdown .headline{ font-family:var(--font-display); font-size:1.15rem; margin:6px 0 4px; }
.countdown .clock{ font-family:var(--font-mono); font-size:1.7rem; letter-spacing:.02em; }
.countdown .sub{ color:var(--muted); font-size:.9rem; margin-top:2px; }

/* ==========================================================================
   ROTATION DIAL (signature element)
   ========================================================================== */
.dial{
  margin:22px 0; border:1px solid var(--rule); border-radius:10px; overflow:hidden;
  display:grid; grid-template-columns:repeat(3,1fr);
}
.dial-col{ padding:14px 12px; border-right:1px solid var(--rule); min-width:0; }
.dial-col:last-child{ border-right:0; }
.dial-col.current{ background:transparent; }
.dial-col.current .dial-week{ color:var(--ink); }
.dial-col.current .dial-name{ color:var(--ink); font-weight:600; }
.dial-col:not(.current) .dial-week,
.dial-col:not(.current) .dial-name,
.dial-col:not(.current) .dial-track{ color:var(--muted); font-weight:400; }
.dial-week{ font-family:var(--font-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:2px; }
.dial-col.current .dial-week::after{ content:" ·  now"; letter-spacing:.08em; }
.dial-row{ display:flex; gap:8px; align-items:baseline; padding:5px 0; border-top:1px solid var(--rule); }
.dial-row:first-of-type{ border-top:0; }
.dial-track{ font-family:var(--font-mono); font-size:.78rem; width:14px; color:var(--muted); }
.dial-name{ font-family:var(--font-display); font-size:1rem; line-height:1.1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* Keep all three rotation columns legible on a narrow phone (375px). */
@media (max-width:430px){
  .dial-col{ padding:12px 7px; }
  .dial-week{ font-size:.62rem; letter-spacing:.06em; }
  .dial-col.current .dial-week::after{ content:" · now"; }
  .dial-track{ font-size:.68rem; width:11px; }
  .dial-name{ font-size:.86rem; }
}

/* ==========================================================================
   KID CARDS (home)
   ========================================================================== */
.cards{ display:grid; gap:12px; }
.card{
  display:block; text-decoration:none; color:inherit;
  border:1px solid var(--rule); border-radius:12px; padding:16px 16px 14px;
  background:#fff;
}
.card:hover{ border-color:var(--ink); }
.card-top{ display:flex; align-items:center; gap:12px; }
.card-letter{
  font-family:var(--font-display); font-weight:600; font-size:1.5rem; line-height:1;
  width:40px; height:40px; min-width:40px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--kidaccent, var(--ink)); color:var(--kidaccent, var(--ink));
}
.card-name{ font-family:var(--font-display); font-size:1.34rem; font-weight:500; }
.card-summary{ color:var(--muted); margin-top:2px; font-size:.95rem; }
.card-meta{ display:flex; flex-wrap:wrap; gap:4px 18px; margin-top:12px; padding-top:12px; border-top:1px solid var(--rule); font-size:.86rem; color:var(--muted); }
.card-meta b{ color:var(--ink); font-weight:500; }
.card-done{ font-family:var(--font-mono); font-size:.74rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); }
.card-with{ display:block; margin-top:2px; font-size:.82rem; color:var(--muted); font-style:italic; }

/* Quiet link row (Money / Principles / Fine print) */
.monthly-note{ text-align:center; color:var(--muted); font-size:.9rem; margin:20px 6px 0; line-height:1.5; }
.monthly-note a{ color:var(--ink); text-decoration:underline; text-underline-offset:2px; }
.link-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:22px; }
.link-row a{
  text-decoration:none; color:var(--ink); border:1px solid var(--rule); border-radius:10px;
  padding:14px 10px; text-align:center; min-height:44px;
  font-family:var(--font-mono); font-size:.78rem; letter-spacing:.06em; text-transform:uppercase;
}
.link-row a:hover{ border-color:var(--ink); }

/* ==========================================================================
   KID VIEW
   ========================================================================== */
.kid-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:6px; }
.kid-letter{
  font-family:var(--font-display); font-weight:600; font-size:2.4rem; line-height:1;
  width:58px; height:58px; min-width:58px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--accent); color:var(--accent);
}
.kid-name{ font-family:var(--font-display); font-size:2rem; font-weight:500; line-height:1.05; }
.kid-sub{ color:var(--muted); font-size:.92rem; margin-top:3px; }
.kid-sub .num{ color:var(--ink); }

.tracker-note{
  font-size:.82rem; color:var(--muted); background:transparent;
  border:1px dashed var(--rule); border-radius:8px; padding:8px 10px; margin:14px 0 6px;
}

/* Hero — illustrative yearly potential */
.hero{ margin:18px 0; padding:16px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.hero .eyebrow{ margin-bottom:2px; }
.hero .big{ font-family:var(--font-mono); font-weight:600; font-size:2.7rem; line-height:1; color:var(--accent); letter-spacing:-.01em; }
.hero .cap{ color:var(--muted); font-size:.82rem; margin-top:4px; }

/* Checklists */
.section-title{ font-family:var(--font-display); font-size:1.28rem; margin:26px 0 4px; }
.group-title{ font-family:var(--font-mono); font-size:.76rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:18px 0 6px; }
.group-title .hint{ text-transform:none; letter-spacing:0; font-family:var(--font-body); font-style:italic; }

ul.list{ list-style:none; margin:0; padding:0; }
li.item{ display:flex; align-items:flex-start; gap:10px; padding:4px 0; border-top:1px solid var(--rule); }
li.item:first-child{ border-top:0; }

.check{ display:flex; align-items:flex-start; gap:12px; flex:1; cursor:pointer; min-height:44px; padding:6px 0; }
.check input{ position:absolute; opacity:0; width:1px; height:1px; }
.box{
  width:26px; height:26px; min-width:26px; margin-top:1px; border:2px solid var(--muted); border-radius:6px;
  display:flex; align-items:center; justify-content:center; color:#fff; background:#fff;
}
.box svg{ width:18px; height:18px; opacity:0; }
.check input:checked + .box{ background:var(--accent); border-color:var(--accent); }
.check input:checked + .box svg{ opacity:1; }
@media (prefers-reduced-motion:no-preference){
  .box svg{ transition:opacity .12s ease; }
}
.check input:focus-visible + .box{ outline:2px solid var(--accent); outline-offset:2px; }
.chooseone .box{ border-radius:50%; }
.txt{ flex:1; padding-top:2px; }
.check input:checked ~ .txt{ color:var(--muted); }
.fel-icon{ width:17px; height:17px; margin-right:2px; vertical-align:-2px; color:var(--accent); }

/* Felicity reads one step larger */
body[data-kid="felicity"] .txt{ font-size:1.09rem; }

/* Camera control + thumbnail */
.cam{
  appearance:none; background:#fff; border:1px solid var(--rule); border-radius:8px;
  width:44px; height:44px; min-width:44px; margin-top:4px;
  display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer;
}
.cam:hover{ color:var(--ink); border-color:var(--ink); }
.cam svg{ width:20px; height:20px; }
.cam.has{ color:var(--accent); border-color:var(--accent); }
.thumb{ width:44px; height:44px; min-width:44px; margin-top:4px; border-radius:8px; overflow:hidden; border:1px solid var(--rule); padding:0; cursor:pointer; background:#fff; }
.thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

/* ---- Splashy home hero banner (color + NYC skyline at dawn) ------------ */
.hero-banner{ position:relative; border-radius:18px; overflow:hidden; margin-bottom:24px; min-height:252px; display:flex;
  box-shadow:0 12px 32px -18px rgba(16,18,24,.55); }
.hero-art{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.hero-copy{ position:relative; align-self:flex-end; width:100%;
  padding:66px 20px 20px;
  background:linear-gradient(to top, rgba(11,13,21,.95) 16%, rgba(11,13,21,.5) 56%, rgba(11,13,21,0));
  color:#F7F6F3; }
.hero-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
.hero-kicker{ font-family:var(--font-mono); font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; color:#EFD39A; }
.hero-chip{ font-family:var(--font-mono); font-size:.64rem; letter-spacing:.09em; text-transform:uppercase; color:#F6E8C7;
  border:1px solid rgba(246,232,199,.45); border-radius:999px; padding:5px 11px; white-space:nowrap; }
.hero-title{ font-family:var(--font-display); font-weight:600; font-size:2.4rem; line-height:1.0; margin:0; color:#fff; letter-spacing:-.015em; }
.hero-dots{ display:flex; gap:7px; margin:13px 0 0; }
.hero-dots span{ width:9px; height:9px; border-radius:50%; display:block; box-shadow:0 0 0 1px rgba(255,255,255,.18); }
.hero-quote{ font-family:var(--font-display); font-style:italic; font-size:1.04rem; line-height:1.34; margin:12px 0 0; max-width:44ch; color:#F3ECDD; }
.hero-quote cite{ font-style:normal; font-family:var(--font-mono); font-size:.68rem; letter-spacing:.03em; color:#DCC9A2; }
@media (max-width:430px){
  .hero-banner{ min-height:232px; }
  .hero-title{ font-size:1.92rem; }
  .hero-kicker{ font-size:.6rem; letter-spacing:.12em; }
  .hero-chip{ font-size:.58rem; padding:4px 9px; }
  .hero-quote{ font-size:.93rem; }
  .hero-copy{ padding:58px 16px 17px; }
}

/* ---- Home "this week" panel (the lively status card) ------------------- */
.week-panel{ position:relative; background:#fff; border:1px solid var(--rule); border-radius:16px;
  padding:20px 18px 16px; margin-bottom:22px; overflow:hidden; }
.week-panel::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg, var(--hyrum) 0 33.33%, var(--rosemary) 33.33% 66.66%, var(--felicity) 66.66% 100%); }
.wp-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.wp-head .eyebrow{ margin:0; }
.wp-end{ font-family:var(--font-mono); font-size:.74rem; color:var(--muted); white-space:nowrap; }
.wp-title{ font-family:var(--font-display); font-weight:500; font-size:1.7rem; line-height:1.05; margin:6px 0 15px; }
.wp-status{ display:flex; align-items:center; gap:14px; padding:14px 15px; border-radius:12px; background:var(--paper); border:1px solid var(--rule); }
.wp-status.downtime{ background:#23262E; border-color:#23262E; color:#F7F6F3; }
.wp-status.closed{ background:var(--paper); }
.wp-state{ font-family:var(--font-mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase;
  padding:7px 11px; border-radius:999px; background:var(--ink); color:#fff; white-space:nowrap; }
.wp-status.downtime .wp-state{ background:#E0B24E; color:#23262E; }
.wp-clockwrap{ line-height:1.12; }
.wp-clock{ font-family:var(--font-mono); font-size:1.5rem; font-weight:500; letter-spacing:.01em; }
.wp-target{ font-family:var(--font-mono); font-size:.72rem; color:var(--muted); margin-top:1px; }
.wp-status.downtime .wp-target{ color:#C6C8CF; }
.wp-sub{ color:var(--muted); font-size:.9rem; margin:13px 2px 2px; }
@media (max-width:430px){ .wp-clock{ font-size:1.28rem; } .wp-title{ font-size:1.5rem; } }

/* Small section labels that give the home page rhythm */
.home-label{ font-family:var(--font-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); margin:0 2px 10px; }
.home-label.spaced{ margin-top:24px; }

/* Large primary action at the bottom of a kid's list */
.btn-xl{ font-size:1.12rem; padding:18px 20px; border-radius:13px; font-weight:500; letter-spacing:.01em; }
.checkoff-wrap{ margin:30px 0 8px; }
.checkoff-note{ text-align:center; color:var(--muted); font-size:.82rem; margin:10px 2px 0; }
.catchup-link{ font-family:var(--font-mono); font-size:.78rem; color:var(--muted); text-decoration:none; }
.catchup-link:hover{ color:var(--ink); }

/* ---- Full-screen effect canvas for the "Done" celebration ------------- */
#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:45; }

/* ---- Rotating-duties reference (no names) ----------------------------- */
.duty-links{ display:flex; gap:8px; margin:12px 0 4px; }
.duty-links a{ flex:1; text-align:center; text-decoration:none; padding:12px 8px; min-height:44px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--rule); border-radius:10px;
  font-family:var(--font-mono); font-size:.74rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink); }
.duty-links a:hover{ border-color:var(--ink); }
.seg-switch{ display:flex; gap:8px; margin:16px 0 8px; }
.seg{ flex:1; text-align:center; text-decoration:none; padding:11px 8px; min-height:44px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--rule); border-radius:10px;
  font-family:var(--font-mono); font-size:.76rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
.seg:hover{ border-color:var(--ink); color:var(--ink); }
.seg.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
.seg.on:hover{ color:#fff; }
.ref-list{ list-style:none; margin:0 0 6px; padding:0; }
.ref-list li{ position:relative; padding:10px 0 10px 20px; border-top:1px solid var(--rule); }
.ref-list li:first-child{ border-top:0; }
.ref-list li::before{ content:"–"; position:absolute; left:2px; color:var(--muted); }

/* ---- Last-week catch-up banner ---------------------------------------- */
.lastweek-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:10px;
  padding:12px 14px; margin:4px 0 16px; background:#fff; }
.lw-txt{ font-size:.9rem; }
.lw-tag{ font-family:var(--font-mono); font-size:.64rem; letter-spacing:.1em; text-transform:uppercase;
  color:#fff; background:var(--accent); border-radius:999px; padding:3px 8px; margin-right:8px; }
.lw-back{ font-family:var(--font-mono); font-size:.76rem; color:var(--accent); text-decoration:none; white-space:nowrap; }
.lw-back:hover{ text-decoration:underline; }

/* ---- Done / N/A mark control (both give full credit) ------------------- */
li.item{ align-items:center; }
.item .txt{ flex:1; }
.mark{ display:flex; gap:6px; flex-shrink:0; }
.mk{ min-height:44px; padding:6px 13px; border:1px solid var(--rule); background:#fff; border-radius:8px;
  font-family:var(--font-mono); font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); cursor:pointer; }
.mk:hover{ border-color:var(--ink); color:var(--ink); }
.mk[aria-pressed="true"]{ color:#fff; }
.mk-done[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); }
.mk-na[aria-pressed="true"]{ background:var(--muted); border-color:var(--muted); }
.item.marked .txt{ color:var(--muted); }

/* ---- Choose-one options (single select; one counts as done) ------------ */
.opt-item{ padding:0; }
.opt{ display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; background:#fff;
  border:0; border-top:1px solid var(--rule); padding:12px 2px; min-height:44px; cursor:pointer; font:inherit; color:inherit; }
.opt-item:first-child .opt{ border-top:0; }
.opt-dot{ width:22px; height:22px; min-width:22px; border:2px solid var(--muted); border-radius:50%; margin-top:2px; position:relative; }
.opt[aria-pressed="true"] .opt-dot{ border-color:var(--accent); }
.opt[aria-pressed="true"] .opt-dot::after{ content:""; position:absolute; inset:4px; border-radius:50%; background:var(--accent); }
.opt:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
.opt-na .txt{ font-family:var(--font-mono); font-size:.82rem; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }

/* ---- Single optional proof photo for the whole week -------------------- */
.photo-block{ border:1px solid var(--rule); border-radius:12px; padding:14px; margin:16px 0; }
.photo-block .eyebrow{ margin-bottom:10px; }
.photo-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.photo-thumb{ width:64px; height:64px; min-width:64px; border-radius:10px; overflow:hidden; border:1px solid var(--rule); padding:0; cursor:pointer; background:#fff; }
.photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo-hint{ color:var(--muted); font-size:.82rem; margin-top:10px; }

/* Progress + actions */
.progress{ font-family:var(--font-mono); font-size:.9rem; margin:20px 0 4px; }
.progress .done{ color:var(--accent); font-weight:600; }
.progress-bar{ height:6px; background:var(--rule); border-radius:3px; overflow:hidden; margin-top:8px; }
.progress-bar span{ display:block; height:100%; background:var(--accent); width:0; }
@media (prefers-reduced-motion:no-preference){ .progress-bar span{ transition:width .2s ease; } }
.all-done{ font-family:var(--font-mono); font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-top:8px; }

.actions{ display:flex; flex-wrap:wrap; gap:10px; margin:22px 0 6px; }
.btn{
  appearance:none; font-family:var(--font-body); font-size:.95rem; cursor:pointer;
  border:1px solid var(--ink); background:#fff; color:var(--ink);
  border-radius:10px; padding:12px 16px; min-height:44px;
}
.btn:hover{ background:var(--ink); color:var(--paper); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ filter:brightness(1.08); background:var(--accent); color:#fff; }
.btn-quiet{ border-color:var(--rule); color:var(--muted); }
.btn-quiet:hover{ background:transparent; color:var(--ink); border-color:var(--ink); }
.btn-block{ width:100%; }

.mini{ display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; }
.mini a, .mini button{
  background:none; border:0; padding:8px 0; min-height:44px; cursor:pointer;
  font-family:var(--font-mono); font-size:.78rem; letter-spacing:.04em; color:var(--muted); text-decoration:none;
}
.mini a:hover, .mini button:hover{ color:var(--ink); }

.factrow{ display:grid; gap:10px; margin:18px 0; }
.fact{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--rule); }
.fact:first-child{ border-top:0; }
.fact .k{ color:var(--muted); font-size:.9rem; }
.fact .v{ text-align:right; }
.fact .v .num{ color:var(--ink); }

.optlist{ list-style:none; margin:10px 0 0; padding:0; }
.optlist li{ padding:8px 0; border-top:1px solid var(--rule); font-size:.95rem; }
.optlist li:first-child{ border-top:0; }

/* ==========================================================================
   MONEY
   ========================================================================== */
.table{ width:100%; border-collapse:collapse; margin:10px 0 4px; }
.table th, .table td{ text-align:left; padding:10px 8px; border-top:1px solid var(--rule); }
.table th{ font-family:var(--font-mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500; }
.table td.n, .table th.n{ text-align:right; font-family:var(--font-mono); }

.waterfall{ display:flex; height:34px; border-radius:8px; overflow:hidden; border:1px solid var(--rule); margin:14px 0 8px; }
.waterfall .seg{ display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:.74rem; color:#fff; }
.waterfall .s-tithe{ background:#3B3E45; }
.waterfall .s-save{ background:#6C707A; }
.waterfall .s-spend{ background:#A9ADB4; color:var(--ink); }
.waterlegend{ display:grid; gap:8px; margin-top:10px; }
.waterlegend div{ font-size:.92rem; }
.waterlegend .pct{ font-family:var(--font-mono); font-weight:600; margin-right:6px; }

.potential{ display:grid; gap:12px; margin:16px 0; }
.pcard{ border:1px solid var(--rule); border-radius:12px; padding:16px; }
.pcard .who{ font-family:var(--font-display); font-size:1.2rem; }
.pcard .ptotal{ font-family:var(--font-mono); font-weight:600; font-size:2.3rem; line-height:1; margin:6px 0 2px; }
.pcard[data-k="hyrum"] .ptotal{ color:var(--hyrum); }
.pcard[data-k="rosemary"] .ptotal{ color:var(--rosemary); }
.pcard[data-k="felicity"] .ptotal{ color:var(--felicity); }
.pcard .pbreak{ color:var(--muted); font-size:.82rem; margin-top:6px; font-family:var(--font-mono); }
.pcard .pstep{ font-size:.86rem; margin-top:8px; }

/* ==========================================================================
   PRINCIPLES (editorial)
   ========================================================================== */
.epigraphs{ margin:8px 0 6px; }
.epigraph{ margin:0 0 22px; }
.epigraph p{ font-family:var(--font-display); font-size:1.32rem; line-height:1.28; margin:0; font-weight:400; }
.epigraph cite{ display:block; font-family:var(--font-mono); font-size:.78rem; color:var(--muted); font-style:normal; margin-top:8px; letter-spacing:.03em; }
.creed h3{ font-size:1.24rem; margin:26px 0 8px; }
.creed ul{ margin:0; padding:0; list-style:none; }
.creed li{ padding:9px 0; border-top:1px solid var(--rule); }
.creed li:first-child{ border-top:0; }

/* ==========================================================================
   FINE PRINT
   ========================================================================== */
.fine h3{ font-family:var(--font-body); font-weight:600; font-size:1rem; margin:24px 0 6px; }
.fine ul{ margin:0; padding-left:18px; }
.fine li{ padding:5px 0; color:var(--ink); }

/* ==========================================================================
   MODAL (photo viewer)
   ========================================================================== */
#modal-root:empty{ display:none; }
.modal-bg{ position:fixed; inset:0; background:rgba(22,24,29,.72); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
.modal{ background:#fff; border-radius:14px; max-width:520px; width:100%; overflow:hidden; }
.modal img{ width:100%; display:block; max-height:64vh; object-fit:contain; background:#111; }
.modal-actions{ display:flex; gap:10px; padding:14px; }
.modal-actions .btn{ flex:1; }

/* ==========================================================================
   TOAST
   ========================================================================== */
#toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--paper);
  padding:10px 16px; border-radius:10px; font-size:.9rem; opacity:0; pointer-events:none; z-index:60; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; }

/* ==========================================================================
   PRINT
   ========================================================================== */
@page wallchart{ size:landscape; margin:10mm; }
@page kidcard{ size:portrait; margin:12mm; }

.print-only{ display:none; }

@media print{
  :root{ --paper:#fff; }
  body{ background:#fff; color:#000; font-size:11pt; }
  .skip, #toast, #modal-root{ display:none !important; }

  /* Screen app hidden while printing a sheet */
  body.printing-wall #app, body.printing-cards #app{ display:none !important; }

  body.printing-wall #print-wall{ display:block; page:wallchart; }
  body.printing-wall #print-cards{ display:none !important; }
  body.printing-cards #print-cards{ display:block; }
  body.printing-cards #print-wall{ display:none !important; }

  #print-wall, #print-cards{ color:#000; }

  /* Wall chart */
  .wc-h{ font-family:var(--font-mono); font-size:11pt; letter-spacing:.06em; text-transform:uppercase; border-bottom:1px solid #000; padding-bottom:6px; margin-bottom:10px; }
  table.wc-grid{ width:100%; border-collapse:collapse; margin-bottom:10px; }
  table.wc-grid th, table.wc-grid td{ border:1px solid #000; padding:6px 8px; text-align:left; font-size:11pt; }
  table.wc-grid th{ font-family:var(--font-mono); font-size:9pt; letter-spacing:.06em; text-transform:uppercase; }
  table.wc-grid td.cur{ font-weight:700; text-decoration:underline; }
  table.wc-grid th.cur{ text-decoration:underline; }
  .wc-key{ font-size:10pt; margin-bottom:10px; }
  .wc-key b{ font-family:var(--font-mono); }
  table.wc-kids{ width:100%; border-collapse:collapse; margin-bottom:10px; }
  table.wc-kids th, table.wc-kids td{ border-bottom:1px solid #000; padding:5px 8px; text-align:left; font-size:10pt; }
  table.wc-kids th{ font-family:var(--font-mono); font-size:8.5pt; letter-spacing:.05em; text-transform:uppercase; }
  .wc-foot{ font-family:var(--font-mono); font-size:9pt; border-top:1px solid #000; padding-top:6px; }

  /* Kid cards */
  .kidcard-page{ break-inside:avoid; }
  .kidcard-page:not(:last-child){ break-after:page; }
  .kc-name{ font-family:var(--font-display); font-size:20pt; }
  .kc-rule{ border:0; border-top:2px solid #000; width:60px; margin:6px 0 12px; }
  .kc-sec{ font-family:var(--font-mono); font-size:9pt; letter-spacing:.08em; text-transform:uppercase; margin:12px 0 4px; }
  .kc-list{ list-style:none; margin:0; padding:0; }
  .kc-list li{ display:flex; gap:8px; align-items:flex-start; padding:3px 0; break-inside:avoid; page-break-inside:avoid; }
  .kc-box{ width:12px; height:12px; min-width:12px; border:1px solid #000; margin-top:3px; }
  .kc-facts{ margin-top:10px; font-size:10pt; }
  .kc-facts div{ padding:2px 0; }
}
</style>

<div id="print-cards" class="print-only" aria-hidden="true"></div>

<!-- Content first, then the app. Both are plain <script> so file:// works. -->
<script src="data.js"></script>
<script>
/* Register the service worker so the home-screen app works offline.
   Only runs over http(s) — opening the file directly (file://) skips it. */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
<script>
"use strict";
/* ==========================================================================
   PRETE FAMILY RESPONSIBILITIES — APPLICATION
   All content comes from FAMILY (data.js). No chore text lives in here.
   ========================================================================== */
(function(){

var C = FAMILY.config;

/* ---------- tiny helpers ------------------------------------------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function kidById(id){ for(var i=0;i<FAMILY.kids.length;i++){ if(FAMILY.kids[i].id===id) return FAMILY.kids[i]; } return null; }
function parseISODate(s){ var p=String(s).split('-'); return new Date(+p[0], (+p[1])-1, +p[2]); }
function pad(n){ return (n<10?'0':'')+n; }

/* ---------- "now" (overridable for testing via ?now=YYYY-MM-DDTHH:MM) ----- */
function getNow(){
  try{
    var q = new URLSearchParams(location.search).get('now');
    if(q){ var d = new Date(q); if(!isNaN(d.getTime())) return d; }
  }catch(e){}
  return new Date();
}

/* ---------- week + rotation math ---------------------------------------- */
function startOfWeek(d){
  // Monday 00:00 of the week containing d (weekStartsOn is Monday=1)
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var dow = x.getDay();                       // 0=Sun..6=Sat
  var back = (dow === 0) ? 6 : (dow - 1);      // days since Monday
  x.setDate(x.getDate() - back);
  return x;
}
function isoDay(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function cycleWeekFor(weekStart){
  var anchor = startOfWeek(parseISODate(C.cycleAnchor.weekStart));
  var weeks = Math.round((weekStart - anchor) / (7*24*3600*1000));
  var base = C.cycleAnchor.cycleWeek - 1;
  return (((base + weeks) % 3) + 3) % 3 + 1;   // 1..3, safe for negatives
}

function weekContext(now){
  var weekStart = startOfWeek(now);

  // Deadline day offset from Monday (deadlineDay: 0=Sun => 6 days after Monday)
  var offset = (C.deadlineDay === 0) ? 6 : (C.deadlineDay - 1);
  var deadline = new Date(weekStart); deadline.setDate(deadline.getDate()+offset);
  deadline.setHours(C.deadlineHour, 0, 0, 0);

  // Credit window closes at creditCutoffHour (24 => next Monday 00:00 = week roll)
  var creditEnd = new Date(weekStart);
  creditEnd.setDate(creditEnd.getDate() + (C.deadlineDay===0?7:C.deadlineDay));
  creditEnd.setHours(0,0,0,0);
  creditEnd.setHours(creditEnd.getHours() + (C.creditCutoffHour - 24));

  // "New week just began" grace window (the Closed acknowledgement)
  var graceEnd = new Date(weekStart);
  graceEnd.setHours(graceEnd.getHours() + (C.newWeekGraceHours||0));

  var state, target;
  if(now < deadline){
    if((C.newWeekGraceHours||0) > 0 && now < graceEnd){ state='closed'; target=deadline; }
    else { state='open'; target=deadline; }
  } else if(now < creditEnd){
    state='downtime'; target=creditEnd;
  } else {
    state='open'; target=deadline;   // defensive; shouldn't occur
  }

  return {
    now:now, weekStart:weekStart, weekStartISO:isoDay(weekStart),
    cycleWeek:cycleWeekFor(weekStart),
    deadline:deadline, creditEnd:creditEnd, state:state, target:target
  };
}

/* ---------- people math -------------------------------------------------- */
function ageOn(birthISO, now){
  var b = parseISODate(birthISO);
  var a = now.getFullYear() - b.getFullYear();
  var m = now.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < b.getDate())) a--;
  return a;
}
function nextBirthday(birthISO, now){
  var b = parseISODate(birthISO);
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var nb = new Date(now.getFullYear(), b.getMonth(), b.getDate());
  if(nb <= today) nb = new Date(now.getFullYear()+1, b.getMonth(), b.getDate());
  return nb;
}
function weeklyAllowance(age){ return age * C.allowanceMultiplier; }

function earningPotential(kid, age){
  var m = C.allowanceMultiplier;
  var weekly  = age * m * 52;
  var monthly = age * m * 12;
  var additional = (C.additionalEarningsByKid && C.additionalEarningsByKid[kid.id]) || 0;
  // Interest is earned on roughly half of a year's earnings, at the savings rate.
  var interest = (C.savingsInterestRate / 2) * (weekly + monthly + additional);
  var total = weekly + monthly + additional + interest;
  return { weekly:weekly, monthly:monthly, additional:additional, interest:interest, total:total };
}

/* ---------- rotation lookups -------------------------------------------- */
function kidLetter(kidId, cw){
  var row = FAMILY.rotation[cw];
  for(var k in row){ if(row[k]===kidId) return k; }
  return '';
}
function bathroomFor(kidId, now){
  var own = FAMILY.bathrooms.own;
  if(own && own[kidId]) return own[kidId];
  var sh = FAMILY.bathrooms.shared;
  if(!sh) return '';
  if(kidId===sh.evenMonthKid || kidId===sh.oddMonthKid){
    var month = now.getMonth()+1;
    var whose = (month % 2 === 0) ? sh.evenMonthKid : sh.oddMonthKid;
    var a = kidById(sh.evenMonthKid), b = kidById(sh.oddMonthKid);
    var pair = (a?a.name:'') + ' & ' + (b?b.name:'');
    if(whose === kidId) return 'Shared bathroom ('+pair+') — your turn this month.';
    return 'Shared bathroom ('+pair+') — '+kidById(whose).name+"'s turn this month.";
  }
  return '';
}
function dinnerNightFor(kidId){
  return kidById(kidId) ? kidById(kidId).dinnerNight : '';
}

/* ---------- checklist model --------------------------------------------- */
function buildChecklist(kid, cw){
  var letter = kidLetter(kid.id, cw);
  var track = FAMILY.duties[letter];
  var dutyGroups = track.groups.map(function(g, gi){
    return {
      title:g.title, chooseOne:(g.type==='choose-one'),
      items:g.items.map(function(t, ii){ return { id:'duty.'+letter+'.g'+gi+'.i'+ii, text:t }; })
    };
  });
  var base = FAMILY.baseline[kid.baselineSet];
  var baseItems = base.items.map(function(t, ii){ return { id:'base.'+kid.baselineSet+'.i'+ii, text:t }; });
  return { letter:letter, track:track, dutyGroups:dutyGroups, baseLabel:base.label, baseItems:baseItems };
}
function progressFor(kid, cw, checks){
  var cl = buildChecklist(kid, cw);
  var dTotal=0, dDone=0;
  cl.dutyGroups.forEach(function(g){
    if(g.chooseOne){
      dTotal += 1;
      var prefix = g.items[0].id.replace(/\.i\d+$/,'');   // e.g. duty.A.g2
      var any = g.items.some(function(it){ return checks[it.id]; }) || !!checks[prefix+'.na'];
      if(any) dDone += 1;
    } else {
      g.items.forEach(function(it){ dTotal++; if(checks[it.id]) dDone++; });
    }
  });
  var bTotal = cl.baseItems.length, bDone = 0;
  cl.baseItems.forEach(function(it){ if(checks[it.id]) bDone++; });
  return { letter:cl.letter, dTotal:dTotal, dDone:dDone, bTotal:bTotal, bDone:bDone,
           total:dTotal+bTotal, done:dDone+bDone };
}

/* ---------- check-off storage (localStorage) ---------------------------- */
function checksKey(weekISO, kidId){ return 'prete.v5.checks.'+weekISO+'.'+kidId; }
function loadChecks(weekISO, kidId){
  try{ return JSON.parse(localStorage.getItem(checksKey(weekISO, kidId))) || {}; }
  catch(e){ return {}; }
}
function saveChecks(weekISO, kidId, obj){
  try{ localStorage.setItem(checksKey(weekISO, kidId), JSON.stringify(obj)); }catch(e){}
}
function purgeOldChecks(keepISOs){
  try{
    var kill=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf('prete.v5.checks.')===0){
        var ok=false;
        keepISOs.forEach(function(w){ if(k.indexOf('prete.v5.checks.'+w+'.')===0) ok=true; });
        if(!ok) kill.push(k);
      }
    }
    kill.forEach(function(k){ localStorage.removeItem(k); });
  }catch(e){}
}

/* ---------- formatting --------------------------------------------------- */
function money(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function longDate(d){ return WD[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }
function shortStamp(d){
  var h=d.getHours(), ap=h>=12?'PM':'AM', h12=h%12; if(h12===0) h12=12;
  return WD[d.getDay()]+' '+MO[d.getMonth()]+' '+d.getDate()+' · '+h12+':'+pad(d.getMinutes())+' '+ap;
}
function birthdayLabel(d){ return MO[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }

/* ---------- inline SVG icons -------------------------------------------- */
var ICON = {
  tick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  fel:'<svg class="fel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.1 4.9L19 9l-4 3.4L16.2 18 12 15.2 7.8 18 9 12.4 5 9l4.9-1.1z"/></svg>'
};

/* ---------- toast -------------------------------------------------------- */
var toastT=null;
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ---------- FX: a fun, randomized burst when a "Done" button is tapped --
   Pure canvas, no libraries. Picks a random variant each time (radial burst,
   confetti, sparkles, fountain, or expanding rings), tinted with the kid's
   accent. Fully skipped when the user prefers reduced motion. */
var FX = (function(){
  var canvas=null, cx=null, dpr=1, W=0, H=0, parts=[], rings=[], raf=null;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function pick(a){ return a[(Math.random()*a.length)|0]; }
  function ensure(){
    if(canvas) return;
    canvas=document.createElement('canvas'); canvas.id='fx'; canvas.setAttribute('aria-hidden','true');
    document.body.appendChild(canvas); cx=canvas.getContext('2d');
    resize(); window.addEventListener('resize', resize);
  }
  function resize(){
    if(!canvas) return;
    dpr=Math.min(window.devicePixelRatio||1, 2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    cx.setTransform(dpr,0,0,dpr,0,0);
  }
  function star(x,y,r,rot){
    cx.beginPath();
    for(var i=0;i<5;i++){
      var a=rot + i*2*Math.PI/5 - Math.PI/2;
      var xa=x+Math.cos(a)*r, ya=y+Math.sin(a)*r;
      var b=a+Math.PI/5, xb=x+Math.cos(b)*r*0.45, yb=y+Math.sin(b)*r*0.45;
      if(i===0) cx.moveTo(xa,ya); else cx.lineTo(xa,ya);
      cx.lineTo(xb,yb);
    }
    cx.closePath(); cx.fill();
  }
  function burst(x, y, accent){
    if(reduce) return;                    // respect prefers-reduced-motion
    ensure();
    accent = accent || '#33556E';
    var pal = [accent, '#E7B84E', '#F4EAD5', pick(['#33556E','#74374F','#A4712A'])];
    var v = pick(['radial','confetti','sparkle','fountain','rings']);
    if(v==='rings'){
      rings.push({x:x,y:y,r:6,vr:rnd(2.2,3.4),a:1,w:rnd(2,3.5),c:accent});
      if(Math.random()<0.7) rings.push({x:x,y:y,r:2,vr:rnd(1.5,2.4),a:0.9,w:2,c:'#F4EAD5'});
    } else {
      var n = v==='confetti'?(rnd(28,42)|0) : v==='sparkle'?(rnd(14,22)|0) : (rnd(24,38)|0);
      for(var i=0;i<n;i++){
        var p={ x:x, y:y, life:0, c:pick(pal), rot:rnd(0,6.283), vr:rnd(-0.35,0.35), g:0.2, ttl:rnd(45,80), shape:'circle', size:rnd(2.5,5), w:5, h:8, tw:false };
        if(v==='radial'){ var a=rnd(0,6.283), s=rnd(2.5,7.5); p.vx=Math.cos(a)*s; p.vy=Math.sin(a)*s; p.g=0.12; p.shape=pick(['circle','circle','rect']); p.w=rnd(3,6); p.h=rnd(3,6); }
        else if(v==='confetti'){ p.vx=rnd(-3.6,3.6); p.vy=rnd(-9,-4); p.g=0.28; p.shape='rect'; p.w=rnd(4,8); p.h=rnd(6,11); p.ttl=rnd(60,95); }
        else if(v==='sparkle'){ var a2=rnd(0,6.283), s2=rnd(1,4); p.vx=Math.cos(a2)*s2; p.vy=Math.sin(a2)*s2-rnd(0.5,2); p.g=0.05; p.shape='star'; p.size=rnd(3,6); p.ttl=rnd(35,62); p.tw=true; }
        else { p.vx=rnd(-2.4,2.4); p.vy=rnd(-11,-6.5); p.g=0.34; p.shape=pick(['circle','rect']); p.w=rnd(3,6); p.h=rnd(3,8); }
        parts.push(p);
      }
    }
    if(!raf) raf=requestAnimationFrame(loop);
  }
  function loop(){
    cx.clearRect(0,0,W,H);
    var r;
    for(r=rings.length-1;r>=0;r--){
      var ri=rings[r]; ri.r+=ri.vr; ri.a-=0.02;
      if(ri.a<=0){ rings.splice(r,1); continue; }
      cx.globalAlpha=Math.max(ri.a,0); cx.strokeStyle=ri.c; cx.lineWidth=ri.w;
      cx.beginPath(); cx.arc(ri.x,ri.y,ri.r,0,6.283); cx.stroke();
    }
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i]; p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      var t=p.life/p.ttl; if(t>=1){ parts.splice(i,1); continue; }
      var al=1-t; if(p.tw) al*=(0.45+0.55*Math.abs(Math.sin(p.life*0.5)));
      cx.globalAlpha=Math.max(al,0); cx.fillStyle=p.c;
      if(p.shape==='circle'){ cx.beginPath(); cx.arc(p.x,p.y,p.size,0,6.283); cx.fill(); }
      else if(p.shape==='star'){ star(p.x,p.y,p.size+2,p.rot); }
      else { cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); }
    }
    cx.globalAlpha=1;
    if(parts.length || rings.length){ raf=requestAnimationFrame(loop); }
    else { raf=null; cx.clearRect(0,0,W,H); }
  }
  return { burst:burst };
})();

function bathShort(text){
  // Compact the bathroom sentence for the small home card.
  if(/your own bathroom/i.test(text)) return 'Bathroom: own';

var cdTimer=null;
function startCountdown(ctx){
  if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
  function tick(){
    var clockEl=document.getElementById('wp-clock'); if(!clockEl){ clearInterval(cdTimer); cdTimer=null; return; }
    var now=getNow();
    // If the state boundary is crossed, re-render the home view fresh.
    var fresh=weekContext(now);
    if(fresh.state!==ctx.state || fresh.weekStartISO!==ctx.weekStartISO){
      CTX=fresh; if(currentRoute()==='home') renderHome(); return;
    }
    var ms=ctx.target - now;
    if(ms<0) ms=0;
    var s=Math.floor(ms/1000);
    var d=Math.floor(s/86400); s-=d*86400;
    var hh=Math.floor(s/3600); s-=hh*3600;
    var mm=Math.floor(s/60); var ss=s-mm*60;
    clockEl.textContent=(d>0?(d+'d '):'')+pad(hh)+':'+pad(mm)+':'+pad(ss);
  }
  tick();
  cdTimer=setInterval(tick, 1000);
}

// A choose-one option (deep-clean list). Selecting one — or the N/A option —

function optHTML(kid, it, checks, groupPrefix){

function wireKid(kid, ctx, cw){
  // Store the active kid context; the delegated #app handlers (attached once
  // in boot) read from here. This avoids stacking duplicate listeners on the
  // persistent #app element every time a kid view re-renders.
  VIEW.kid=kid; VIEW.ctx=ctx; VIEW.cw=cw; VIEW.weekISO=ctx.weekStartISO;

  // These buttons are re-created on each render, so per-element listeners are
  // safe here — the old elements (and their listeners) are discarded on render.
  $('#check-off').addEventListener('click', function(){ checkOff(kid, ctx, cw); });
  $('#reset-week').addEventListener('click', function(){ resetWeek(kid, ctx.weekStartISO, cw); });
}

// Delegated CLICK handler — attached ONCE (see boot). Acts only on a kid view.
// Handles the Done/N/A marks and the choose-one single-select options.
function onAppClick(e){
  if(!VIEW.kid) return;
  var kid=VIEW.kid, weekISO=VIEW.weekISO, cw=VIEW.cw;

  var mk=e.target.closest && e.target.closest('button[data-mark]');
  if(mk){
    var id=mk.getAttribute('data-id'), val=mk.getAttribute('data-mark');
    var checks=loadChecks(weekISO, kid.id);
    if(checks[id]===val) delete checks[id]; else checks[id]=val;   // toggle
    saveChecks(weekISO, kid.id, checks);
    var li=mk.closest('li.item');
    li.querySelectorAll('button[data-mark]').forEach(function(b){
      b.setAttribute('aria-pressed', checks[id]===b.getAttribute('data-mark') ? 'true':'false');
    });
    li.classList.toggle('marked', checks[id]==='done'||checks[id]==='na');
    updateProgress(kid, cw, checks);
    // Fun burst only when an item is newly marked Done (not N/A, not un-toggled)
    if(val==='done' && checks[id]==='done'){
      var rc=mk.getBoundingClientRect();
      FX.burst(rc.left+rc.width/2, rc.top+rc.height/2, kid.accent);
    }
    return;
  }

  var opt=e.target.closest && e.target.closest('button[data-choose]');
  if(opt){
    var oid=opt.getAttribute('data-id'), group=opt.getAttribute('data-group');
    var checks2=loadChecks(weekISO, kid.id);
    var wasSel=!!checks2[oid];
    // clear every option in this group (including N/A), then set the clicked one
    $('#app').querySelectorAll('button[data-choose][data-group="'+CSS.escape(group)+'"]').forEach(function(b){
      delete checks2[b.getAttribute('data-id')]; b.setAttribute('aria-pressed','false');
    });
    if(!wasSel){ checks2[oid]='done'; opt.setAttribute('aria-pressed','true'); }
    saveChecks(weekISO, kid.id, checks2);
    updateProgress(kid, cw, checks2);
    // Burst when a choose-one job is newly picked
    if(!wasSel){
      var rc2=opt.getBoundingClientRect();
      FX.burst(rc2.left+Math.min(rc2.width*0.18,60), rc2.top+rc2.height/2, kid.accent);
    }
    return;
  }
}

function updateProgress(kid, cw, checks){
  var pr=progressFor(kid, cw, checks);
  var pt=$('#prog-text'); if(pt){
    pt.innerHTML='<span class="done"><span class="num">'+pr.done+'</span></span> of <span class="num">'+pr.total+'</span> checked';
  }
  var bar=$('#prog-bar'); if(bar) bar.style.width=(pr.total?Math.round(pr.done/pr.total*100):0)+'%';
  var ad=$('#all-done'); if(ad) ad.style.display=(pr.total>0&&pr.done===pr.total)?'':'none';
}

/* ---------- check off with Mom / Dad ------------------------------------ */
// Builds the plain-text summary that gets texted to a parent.
function buildMessage(kid, ctx, cw){
  var checks=loadChecks(ctx.weekStartISO, kid.id);
  var pr=progressFor(kid, cw, checks);
  var dutyDone=(pr.dDone===pr.dTotal);
  var baseDone=(pr.bDone===pr.bTotal);
  var allDone=(pr.total>0 && pr.done===pr.total);
  var lines=[];
  lines.push(kid.name+' — Week '+cw+(ctx.last?' (last week)':'')+(allDone?' chores done':' chores update'));
  lines.push(shortStamp(getNow()));
  lines.push(FAMILY.duties[pr.letter].label+': '+pr.dDone+' of '+pr.dTotal+(dutyDone?' ✓':''));
  lines.push('Baseline: '+pr.bDone+' of '+pr.bTotal+(baseDone?' ✓':''));
  return lines.join('\n');
}
// Opens a pre-filled text to the parents (numbers come from data.js). If no
// numbers are configured, it just reminds the kid to check off in person.
function checkOff(kid, ctx, cw){
  var body=buildMessage(kid, ctx, cw);
  var phones=(C.parents||[]).map(function(p){ return p.phone; }).filter(Boolean);
  // With numbers configured, address the text to the parents (the kid sends to
  // whichever one is checking them off). Without numbers (e.g. a publicly shared
  // copy with the numbers removed), open a blank message the kid addresses by hand.
  var url = phones.length
    ? 'sms:'+phones.join(',')+'&body='+encodeURIComponent(body)
    : 'sms:&body='+encodeURIComponent(body);
  location.href=url;
}
function resetWeek(kid, weekISO, cw){
  if(!window.confirm('Reset for '+kid.name+'? This clears the check-offs for this week on this device only.')) return;
  try{ localStorage.removeItem(checksKey(weekISO, kid.id)); }catch(e){}
  route();   // re-render the current view (this week or last week)
  toast('Checklist reset.');
}

function doPrint(which){
  CTX=weekContext(getNow());
  if(which==='wall'){ buildWallChart(); document.body.classList.add('printing-wall'); }
  else { buildKidCards(); document.body.classList.add('printing-cards'); }
  var cleanup=function(){
    document.body.classList.remove('printing-wall');
    document.body.classList.remove('printing-cards');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(function(){ window.print(); }, 60);
  // Fallback cleanup in case afterprint doesn't fire
  setTimeout(cleanup, 1500);
}

/* =========================================================================
   ROUTER
   ========================================================================= */
function currentRoute(){
  var hash=(location.hash||'').replace(/^#\/?/, '');
  if(hash==='' ) return 'home';
  if(hash==='money' || hash==='principles' || hash==='fineprint') return hash;
  if(hash==='duties') return 'duties:A';
  if(hash.indexOf('duties/')===0){ var t=hash.slice(7).toUpperCase(); return 'duties:'+(FAMILY.duties[t]?t:'A'); }
  var parts=hash.split('/');
  if(kidById(parts[0])) return 'kid:'+parts[0]+(parts[1]==='last'?':last':'');
  return 'home';
}
var lastRoute=null;
function route(){
  if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
  CTX=weekContext(getNow());
  VIEW.kid=null;   // clear active kid context; renderKid resets it
  var r=currentRoute();
  lastRoute=r;
  if(r==='home'){ document.body.removeAttribute('data-kid'); renderHome(); }
  else if(r.indexOf('kid:')===0){ var kp=r.slice(4).split(':'); renderKid(kp[0], { last: kp[1]==='last' }); }
  else if(r.indexOf('duties:')===0){ renderDuties(r.slice(7)); }
  else if(r==='money'){ renderMoney(); }
  else if(r==='principles'){ renderPrinciples(); }
  else if(r==='fineprint'){ renderFinePrint(); }
  else { renderHome(); }
  // Move focus to main for screen-reader + keyboard users
  var app=$('#app'); if(app){ app.focus({preventScroll:true}); }
  window.scrollTo(0,0);
}
function currentRouteName(){ return lastRoute==='home'?'home':lastRoute; }

/* Crossfade wrapper */
function setView(html){
  // Insert content SYNCHRONOUSLY so callers can wire up buttons / start the
  // countdown immediately after. The crossfade is applied to the freshly
  // inserted .view node (fade-in), which keeps motion without hiding the DOM.
  var app=$('#app');
  app.classList.remove('fade-out');
  app.innerHTML='<div class="view">'+html+'</div>';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  var v=app.firstChild;
  v.classList.add('fade-out');
  void v.offsetWidth;   // force reflow so the transition actually runs
  window.requestAnimationFrame(function(){ v.classList.remove('fade-out'); });
}
// tiny alias used by countdown
function currentRoute_(){ return currentRoute(); }

/* =========================================================================
   BOOT
   ========================================================================= */
var BOOTED=false;
function boot(){
  if(BOOTED) return; BOOTED=true;
  var ctx=weekContext(getNow());
  var prior=new Date(ctx.weekStart); prior.setDate(prior.getDate()-7);
  var keep=[ctx.weekStartISO, isoDay(prior)];
  purgeOldChecks(keep);
  // Delegated click listener attached exactly once on the persistent #app element.
  var app=$('#app');
  app.addEventListener('click', onAppClick);
  window.addEventListener('hashchange', route);
  route();
}
// expose a couple names the countdown closure references
window.__preteRoute = currentRoute;
document.addEventListener('DOMContentLoaded', boot);
if(document.readyState!=='loading'){ boot(); }

// Fix: countdown references currentRoute() — make sure it resolves
})();
